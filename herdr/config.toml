# Required plugins (install manually):
# herdr plugin install lmilojevicc/herdr-splits.nvim 

onboarding = false

[theme]
name = "catppuccin"

[keys]
#prefix = "ctrl+\\"

help = "prefix+?"
detach = "prefix+q"
goto = [ "prefix+g" ]
#open_notification_target = "prefix+g"
toggle_sidebar = "prefix+m"

#Scrollback
# edit_scrollback
# copy_mode

# Workspace
new_workspace = "prefix+shift+w"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+x"
previous_workspace = "cmd+shift+["
next_workspace = "cmd+shift+]"

# Tab
new_tab = "prefix+w"
rename_tab = "prefix+r"
close_tab = "prefix+x"
previous_tab = "cmd+["
next_tab = "cmd+]"
move_tab_previous = "prefix+n"
move_tab_next = "prefix+o"

split_vertical = "prefix+v"
split_horizontal = "prefix+s"

[[keys.command]]
key = "ctrl+n"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+e"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+i"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+o"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "alt+n"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "alt+e"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "alt+i"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "alt+o"
type = "plugin_action"
command = "herdr-splits.resize-right"

# Agent
#previous_agent
#next_agent


[terminal]
default_shell = "fish"
shell_mode = "login"


[ui]
# agent_panel_sort = "spaces"
sidebar_width = 32
sidebar_max_width = 42
prompt_new_tab_name = false

#tab_bar_position = "bottom"

pane_borders = true
pane_outer_borders = true

agent_panel_sort = "spaces"

[theme.custom]
sidebar_bg = "#181824"

[advanced]
scrollback_limit_bytes = 100000000
